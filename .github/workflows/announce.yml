name: Announce deploy

# After main changes, tell search engines (IndexNow: Bing, Yandex, others)
# and the Wayback Machine about every page in the sitemap. Google does not
# accept IndexNow; it reads the sitemap through Search Console.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: announce
  cancel-in-progress: true

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      SITE: https://civilizationalunity.com
      INDEXNOW_KEY: 6011d9caac73d935f0178488511beb19
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Netlify to serve this commit
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # The key file proves the domain; the files this push changed prove the deploy.
          # Netlify rewrites pages that hold a form, so those cannot be compared byte for byte.
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          changed=$(git diff --name-only --diff-filter=AM "$base" HEAD -- . ':(exclude).*' ':(exclude)_*' ':(exclude)docs' ':(exclude)scripts' ':(exclude)*.md' \
            | while read -r f; do grep -q 'netlify-honeypot' "$f" || echo "$f"; done)
          echo "Files to confirm live:"; echo "${changed:-(none)}"
          for i in $(seq 1 30); do
            ok=1
            [ "$(curl -fsS "$SITE/$INDEXNOW_KEY.txt" || true)" = "$INDEXNOW_KEY" ] || ok=0
            for f in $changed; do
              [ "$(curl -fsS "$SITE/$f" | sha256sum)" = "$(sha256sum < "$f")" ] || { ok=0; break; }
            done
            [ "$ok" = 1 ] && exit 0
            sleep 20
          done
          echo "Netlify did not serve this commit within 10 minutes" >&2; exit 1
      - name: Submit sitemap URLs to IndexNow
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          code=$(jq -n --argjson urls "$urls" --arg key "$INDEXNOW_KEY" --arg site "$SITE" \
            '{host: "civilizationalunity.com", key: $key, keyLocation: ($site + "/" + $key + ".txt"), urlList: $urls}' \
            | curl -sS -o /tmp/indexnow.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @-)
          echo "IndexNow HTTP $code"; cat /tmp/indexnow.txt
          case "$code" in 200|202) ;; *) exit 1 ;; esac
      - name: Save pages to the Wayback Machine
        continue-on-error: true
        run: |
          for u in $(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "https://web.archive.org/save/$u" || true)
            echo "$code $u"
            sleep 10
          done

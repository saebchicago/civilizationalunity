name: Switch public media sheet links
on:
  push:
    branches: [civilizational-unity-source-polish]
    paths: ['.github/workflows/switch-media-sheet-links.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civilizational-unity-source-polish
      - name: Replace stale PDF entry points
        shell: python
        run: |
          from pathlib import Path
          for name in ['speaking.html','press.html']:
              p=Path(name); s=p.read_text()
              s=s.replace('href="media/al-ahsan-one-sheet.pdf"','href="/press-sheet"')
              s=s.replace('Download the one-page sheet','Open printable media sheet')
              p.write_text(s)
      - name: Validate and commit
        run: |
          node scripts/site-audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- speaking.html press.html
          git commit -m "fix: replace stale media PDF links with validated sheet [skip ci]"
          git push origin HEAD:civilizational-unity-source-polish

name: Site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish-pr:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply final static editorial polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def base_polish(path):
              p=Path(path); s=p.read_text()
              if 'assets/interior.css' not in s:
                  s=s.replace('<link rel="stylesheet" href="assets/site.css">','<link rel="stylesheet" href="assets/site.css">\n<link rel="stylesheet" href="assets/interior.css">')
              s=s.replace('<body>','<body class="interior">')
              s=s.replace('<a href="/framework">Framework</a>','<a href="/framework">Ideas</a>')
              s=s.replace('<a href="/framework" aria-current="page">Framework</a>','<a href="/framework" aria-current="page">Ideas</a>')
              s=s.replace('<a href="/speaking">Speaking</a>','<a href="/speaking">Talks</a>')
              s=s.replace('<a href="/speaking" aria-current="page">Speaking</a>','<a href="/speaking" aria-current="page">Talks</a>')
              p.write_text(s)

          for f in ['writing.html','speaking.html','press.html']:
              base_polish(f)

          p=Path('writing.html'); s=p.read_text()
          s=re.sub(r'<section class="hero shell" style="padding-bottom:0">.*?</section>', '''<section class="hero shell">
  <p class="hero-kicker">The published record</p>
  <h1>Writing</h1>
  <p class="lede">Five books and a wider record of articles, chapters and public essays trace a long inquiry into civilizational identity, institutions, governance, historical method and encounters between Muslim and Western worlds.</p>
  <p class="quiet-note">The archive below is selected rather than exhaustive. Publication types remain labeled so readers can distinguish peer-reviewed scholarship, books, chapters and public commentary.</p>
</section>''', s, count=1, flags=re.S)
          canon='''<section class="start-route" aria-labelledby="start-reading">
  <div class="start-route__intro">
    <p class="eyebrow">Begin with five works</p>
    <h2 id="start-reading">A route through the intellectual arc</h2>
    <p class="quiet-note">Not a ranking: simply a compact path from institutions and identity to civilizational dialogue, historical method and governance.</p>
  </div>
  <ol class="route-list">
    <li><span class="n">01</span><div><strong><em>OIC: Introduction to an Islamic Political Institution</em> (1988)</strong><small>Begin with the institutional question: how a modern Muslim-world organization was formed and what collective political action can—and cannot—do.</small></div></li>
    <li><span class="n">02</span><div><strong><em>Ummah or Nation? Identity Crisis in Contemporary Muslim Society</em> (1992)</strong><small>Move from institutions to belonging: the tension between civilizational community and the modern nation-state.</small></div></li>
    <li><span class="n">03</span><div><strong>“Dialogue of Civilizations: Islamic and Western Perceptions” (2011)</strong><small>Enter the sustained debate over dialogue, clash and the historical record of Muslim–Western encounter.</small></div></li>
    <li><span class="n">04</span><div><strong>“Problems of Eurocentric Views of History” (2013)</strong><small>Turn the lens toward historical method itself: who frames the record, and what disappears when one vantage point becomes universal.</small></div></li>
    <li><span class="n">05</span><div><strong><em>Qur’anic Guidance for Good Governance</em> (2017)</strong><small>Return to institutions through the moral question of governance, co-edited with Stephen B. Young.</small></div></li>
  </ol>
</section>'''
          s=re.sub(r'<div class="provenance provenance--wide">.*?</div>', canon, s, count=1, flags=re.S)
          s=s.replace('<span class="filters__lbl">Show</span>','<span class="filters__lbl">Browse by form</span>')
          p.write_text(s)

          p=Path('speaking.html'); s=p.read_text()
          s=re.sub(r'<section class="hero shell" style="padding-bottom:0">.*?</section>', '''<section class="hero shell">
  <p class="hero-kicker">Lectures, seminars and public conversation</p>
  <h1>Talks</h1>
  <p class="lede">Professor al-Ahsan’s lecture topics grow from books, courses and published scholarship rather than from a separate speaking catalogue. They can be framed for universities, policy audiences, civic institutions or advanced seminars.</p>
  <div class="btnrow"><a class="btn btn--go" href="#invite">Send an invitation</a><a class="btn btn--quiet" href="/press-sheet">Printable media sheet</a></div>
</section>''', s, count=1, flags=re.S)
          s=s.replace('<p class="eyebrow">Five talks</p>\n  <h2>Topics</h2>\n  <p class="provenance"><strong>Provenance:</strong> talk summaries are editorial syntheses of Professor al-Ahsan’s published work and teaching record; they are not quotations. Discussion and teaching aids are labeled separately.</p>', '<p class="eyebrow">Five conversations</p>\n  <h2>Topics</h2>\n  <p class="quiet-note">The summaries below draw on the published record and teaching history; the linked writing remains the authoritative source.</p>')
          s=s.replace('Request this talk &#8594;','Inquire about this topic &#8594;')
          s=s.replace('<p class="eyebrow">Suggested formats</p>\n        <h2>Ways to frame a request</h2>','<p class="eyebrow">Formats</p>\n        <h2>Lecture, seminar, conversation</h2>')
          s=s.replace('<p class="source-note">These are request formats, not a guarantee of availability; scope and timing are confirmed case by case.</p>','<p class="quiet-note">Format, timing and scope are arranged case by case.</p>')
          s=s.replace('what you want the audience to walk away with.','the question or theme you hope the conversation will address.')
          s=s.replace('One-page sheet for a programming committee<br>\n        <a href="/press-sheet">al-ahsan-one-sheet.pdf</a>','Printable sheet for a programming committee<br>\n        <a href="/press-sheet">Open media sheet</a>')
          p.write_text(s)

          p=Path('press.html'); s=p.read_text()
          s=re.sub(r'<section class="hero shell" style="padding-bottom:0">.*?</section>', '''<section class="hero shell">
  <p class="hero-kicker">For editors, producers and event organizers</p>
  <h1>Press &amp; media</h1>
  <p class="lede">Verified biographical notes, fast facts, name forms and subject areas for accurate introductions, reporting and programming.</p>
  <div class="btnrow"><a class="btn btn--go" href="/press-sheet">Open printable media sheet</a><a class="btn btn--quiet" href="/speaking#invite">Contact</a></div>
</section>''', s, count=1, flags=re.S)
          s=s.replace('<p class="provenance"><strong>Source discipline:</strong> biographical facts on this page are based on Professor al-Ahsan’s supplied CV and linked authority or institutional records. Promotional superlatives and unverified availability claims are intentionally excluded.</p>', '<p class="quiet-note">Biographical details are drawn from Professor al-Ahsan’s supplied CV and linked institutional or authority records. Time-sensitive details should be checked before publication.</p>')
          s=s.replace('<p class="eyebrow">What to call him about</p>\n  <h2>Areas of comment</h2>','<p class="eyebrow">Selected areas of expertise</p>\n  <h2>Scholarship and public comment</h2>')
          s=s.replace('These areas are drawn from his published record. Availability for comment should be confirmed through the contact form.','These subjects recur across his published record; interview and event availability can be requested through the contact form.')
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          s=s.replace('Independent reviews are linked in full, including criticism as well as praise.','Independent reviews place the work in scholarly conversation, with the full texts linked for context.')
          s=s.replace('<h2>Let the record do the praising.</h2>','<h2>Independent readings of the work.</h2>')
          s=s.replace('Follow the ideas into the full writing record, biographical sources, lecture topics and editorial notes.','Follow the ideas into the full writing record, biographical sources, lectures and public work.')
          s=s.replace('<p class="foot__h">Editorial note</p>\n        <p class="foot__ids">The site distinguishes Professor al-Ahsan’s authored scholarship from editorial synthesis and links readers back to the underlying record. <a href="/about">Read the editorial standard.</a></p>', '<p class="foot__h">Authority record</p>\n        <p class="foot__ids"><a href="https://www.wikidata.org/wiki/Q24946801">Wikidata</a> · <a href="https://viaf.org/viaf/33537331">VIAF</a> · <a href="https://irep.iium.edu.my/profile/853">IIUM repository</a><br><a href="/press">Name forms, bios and source records →</a></p>')
          p.write_text(s)

          Path('.polish-trigger').unlink(missing_ok=True)
          PY
      - name: Run site audit before committing
        run: node scripts/site-audit.mjs
      - name: Commit polished pages to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Polish interior scholarly experience"
          git push origin HEAD:${{ github.head_ref }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source, metadata and durability audit
        run: node scripts/site-audit.mjs

name: Repair E2E audit validator
on:
  push:
    branches: [civilizational-unity-source-polish]
    paths: ['.github/workflows/fix-e2e-audit-validator.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civilizational-unity-source-polish
      - name: Fix over-escaped JSON-LD regex
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/apply-e2e-platinum-audit.yml')
          s=p.read_text()
          old="for(const m of s.matchAll(/<script type=\"application\\\\/ld\\\\+json\">([\\\\s\\\\S]*?)<\\\\/script>/g)){try{JSON.parse(m[1])}catch(e){failures.push(`${f}: invalid JSON-LD: ${e.message}`)}}"
          new="for(const m of s.matchAll(new RegExp('<script type=\\\"application/ld\\\\+json\\\">([\\\\s\\\\S]*?)</script>','g'))){try{JSON.parse(m[1])}catch(e){failures.push(`${f}: invalid JSON-LD: ${e.message}`)}}"
          if old not in s:
              raise SystemExit('target validator line not found')
          p.write_text(s.replace(old,new))
      - name: Commit validator fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/apply-e2e-platinum-audit.yml
          git commit -m "chore: fix E2E audit validator [skip ci]"
          git push origin HEAD:civilizational-unity-source-polish

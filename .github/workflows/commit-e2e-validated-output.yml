name: Commit validated E2E site output
on:
  push:
    branches: [civilizational-unity-source-polish]
    paths: ['.github/workflows/commit-e2e-validated-output.yml']
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civilizational-unity-source-polish
          fetch-depth: 0
      - name: Reproduce tested transformation and validator
        shell: python
        run: |
          from pathlib import Path
          import re, textwrap
          wf=Path('.github/workflows/apply-e2e-platinum-audit.yml').read_text()
          m=re.search(r'- name: Apply source-grounded E2E upgrades\n\s+shell: python\n\s+run: \|\n(.*?)(?=\n\s+- name: Run quality gate)',wf,re.S)
          if not m: raise SystemExit('tested transform not found')
          exec(compile(textwrap.dedent(m.group(1)),'<e2e-transform>','exec'),{'__name__':'__main__'})
          Path('.github/workflows/site-quality.yml').unlink(missing_ok=True)
          audit='''import fs from "node:fs";
          import path from "node:path";
          const html=fs.readdirSync(process.cwd()).filter(f=>f.endsWith(".html"));
          const failures=[];
          const banned=["EDIT-DOMAIN","still publishing monthly","Monthly cadence through 2026","answers press requests himself","DELETE THIS BLOCK BEFORE PUBLISHING"];
          for(const f of html){const s=fs.readFileSync(f,"utf8");for(const token of banned)if(s.includes(token))failures.push(`${f}: stale phrase ${token}`);for(const req of ["<title>","name=\\"description\\"","rel=\\"canonical\\"","<main","<h1","class=\\"skip\\""])if(!s.includes(req))failures.push(`${f}: missing ${req}`);const ids=[...s.matchAll(/\\sid="([^"]+)"/g)].map(m=>m[1]);const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);if(dup.length)failures.push(`${f}: duplicate ids ${[...new Set(dup)].join(",")}`);const o='<script type="application/ld+json">',c='</script>';let p=0;while((p=s.indexOf(o,p))>=0){const a=p+o.length,b=s.indexOf(c,a);if(b<0){failures.push(`${f}: unclosed JSON-LD`);break}try{JSON.parse(s.slice(a,b))}catch(e){failures.push(`${f}: invalid JSON-LD ${e.message}`)}p=b+c.length;}}
          const h=fs.readFileSync("_headers","utf8");if(h.includes("max-age=31536000, immutable"))failures.push("immutable unversioned asset cache");for(const f of ["llms.txt","about.html","framework.html","thanks.html"])if(!fs.existsSync(f))failures.push(`missing ${f}`);if(failures.length){console.error(failures.join("\\n"));process.exit(1)}console.log(`Site audit passed: ${html.length} HTML pages checked.`);
          '''
          Path('scripts/site-audit.mjs').write_text(textwrap.dedent(audit))
      - name: Validate
        run: |
          node scripts/site-audit.mjs
          grep -q "Polish never outranks provenance" about.html
          grep -q "Six recurring moves" framework.html
          grep -q "max-age=300, must-revalidate" _headers
          grep -q "Content-Security-Policy" _headers
          grep -q "Author-approved site formulation" llms.txt
      - name: Commit and push validated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html framework.html writing.html speaking.html press.html about.html thanks.html llms.txt _headers _redirects sitemap.xml readme-deploy.md assets/site.js assets/site.css scripts/site-audit.mjs
          git commit -m "feat: elevate Civilizational Unity through E2E expert audit [skip ci]"
          git push origin HEAD:civilizational-unity-source-polish

name: Normalize home social metadata
on:
  push:
    branches: [civilizational-unity-source-polish]
    paths: ['.github/workflows/fix-home-metadata.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: civilizational-unity-source-polish
      - name: Remove duplicate OpenGraph fields
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          desc='Civilizational Unity is a public knowledge resource for historian Abdullah al-Ahsan: five books, more than fifty publications, the Dignity Framework, talks, videos, and source-linked scholarship on dignity, governance and civilizational change.'
          s=re.sub(r'<meta property="og:description" content="[^"]*">', f'<meta property="og:description" content="{desc}">', s, count=1)
          s=re.sub(r'<meta name="twitter:description" content="[^"]*">', f'<meta name="twitter:description" content="{desc}">', s, count=1)
          s=re.sub(r'\n<meta property="og:type" content="profile">\n<meta property="og:title"[^>]*>\n<meta property="og:description"[^>]*>\n<meta property="og:url"[^>]*>', '\n<meta property="og:type" content="profile">', s, count=1)
          p.write_text(s)
      - name: Validate and commit
        run: |
          node scripts/site-audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "fix: normalize home search and social metadata [skip ci]"
          git push origin HEAD:civilizational-unity-source-polish
